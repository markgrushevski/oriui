name: Release

# Changesets-driven release. On push to main, changesets/action opens (or updates) a "Version
# Packages" PR that aggregates the pending changesets; merging that PR runs the `release` script
# (changeset publish) to publish the bumped packages to npm.
#
# Auth is npm **Trusted Publishing (OIDC)** — no token to store or rotate. One-time setup: on npmjs,
# per package (Settings -> Trusted Publishers -> GitHub Actions), authorise this repo + the workflow
# `release.yml`. The job requests an OIDC token via `id-token: write`; npm exchanges it for publish
# rights and adds provenance automatically. Requires npm >= 11.5.1 (installed below).
#
# Bootstrap: @oriui/headless and @oriui/vue don't exist on npm yet, so a trusted publisher can't be
# configured for them until their first publish — do that once (locally, or a temporary token), then
# add their trusted publishers and this workflow needs no token at all. See RELEASING.md.
on:
    push:
        branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: write # changesets: version commit + git tag
    pull-requests: write # changesets: the "Version Packages" PR
    id-token: write # npm Trusted Publishing (OIDC) + provenance

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            # No `registry-url`: with OIDC there is no token, and setup-node's `_authToken` .npmrc line
            # (empty) would 401 before OIDC engages. npm publishes to the default registry via OIDC.
            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: npm

            # OIDC publishing needs npm >= 11.5.1 for trusted publishing + provenance. PIN it, don't
            # track `npm@latest`: a later npm (~11.6.x) regressed provenance with
            # `Cannot find module 'sigstore'`, which broke the alpha.11 publish. 11.5.1 is the OIDC
            # minimum and predates that regression.
            - name: Ensure a known-good npm (OIDC + provenance)
              run: npm install -g npm@11.5.1

            - name: Install (npm ci — root + workspaces)
              run: npm ci

            - name: Install Playwright Chromium (for the e2e leg of the gate)
              run: npx playwright install --with-deps chromium

            # Gate the publish on the same checks CI runs: one root script, `npm run gate`, and
            # tests/packaging.test.ts fails if a check reachable from ci.yml is not reachable from here.
            # ORI_SMOKE_IGNORE_SCRIPTS: the gate has just built the dist the smoke leg packs.
            - name: Quality gate (lint → types → test → build → size → publint → attw → smoke → docs)
              run: npm run gate
              env:
                  ORI_SMOKE_IGNORE_SCRIPTS: '1'

            - name: Quality gate (e2e — real Chromium)
              run: npm run test:e2e

            - name: Create Release PR or publish to npm
              uses: changesets/action@v1
              with:
                  version: npm run version
                  publish: npm run release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # A failed publish shows only an exit code; npm writes the real error to its debug log, which
            # dies with the runner. Print it. npm redacts credentials there.
            - name: npm debug log (the publish's real error)
              if: failure()
              run: |
                  for log in ~/.npm/_logs/*-debug-0.log; do
                      echo "::group::$log"
                      cat "$log"
                      echo "::endgroup::"
                  done
